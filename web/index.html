<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="ambient"></div>
<div id="grain"></div>

<aside id="rail">
  <div class="rail-mark" title="Aurora">
    <span class="rail-dot"></span>
  </div>
  <nav class="rail-nav">
    <a href="#/" data-route="/" class="rail-link" title="Now Playing">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
      <span>Now</span>
    </a>
    <a href="#/library" data-route="/library" class="rail-link" title="Library">
      <svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15.5 5l4 15"/></svg>
      <span>Library</span>
    </a>
    <a href="#/playlists" data-route="/playlists" class="rail-link" title="Playlists">
      <svg viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18" cy="15" r="3"/><path d="M21 15V7"/></svg>
      <span>Lists</span>
    </a>
  </nav>
  <div class="rail-foot">
    <button id="rail-search" title="Search &amp; download (/)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    </button>
  </div>
</aside>

<main id="view"></main>

<footer id="bar" class="idle">
  <div class="bar-track">
    <div class="bar-art" id="bar-art"></div>
    <div class="bar-meta">
      <div class="bar-title" id="bar-title">Nothing playing</div>
      <div class="bar-artist" id="bar-artist">Pick something from your library</div>
    </div>
  </div>

  <div class="bar-center">
    <div class="bar-buttons">
      <button id="btn-shuffle" class="ghost" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M3 7h4l3 5M21 7h-5l-6 10H3M21 17h-5"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
      </button>
      <button id="btn-prev" class="ghost" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M18 6v12L9 12zM6 5v14" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-play" class="primary" title="Play / pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="2.6"/></svg>
      </button>
      <button id="btn-next" class="ghost" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 6v12l9-6zM18 5v14" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-repeat" class="ghost" title="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 00-4 4v1M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 004-4v-1"/></svg>
        <span class="repeat-one">1</span>
      </button>
    </div>
    <div class="bar-seek">
      <span class="t" id="t-now">0:00</span>
      <div class="seek" id="seek"><div class="seek-buf"></div><div class="seek-fill" id="seek-fill"><i></i></div></div>
      <span class="t" id="t-end">0:00</span>
    </div>
  </div>

  <div class="bar-right">
    <button id="btn-mute" class="ghost" title="Mute">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16.5 9a4 4 0 010 6M19 6.5a7.5 7.5 0 010 11"/></svg>
    </button>
    <div class="vol" id="vol"><div class="vol-fill" id="vol-fill"></div></div>
  </div>
</footer>

<div id="overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<div id="toasts"></div>
<audio id="audio" crossorigin="anonymous" preload="metadata"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/color.js"></script>
<script src="/js/visualizer.js"></script>
<script src="/js/lyrics.js"></script>
<script src="/js/player.js"></script>
<script src="/js/views.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
